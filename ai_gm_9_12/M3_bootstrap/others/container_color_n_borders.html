<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Colors and Borders</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h1>Bootstrap Colors and Borders</h1>

        <hr>

        <!-- Colored Container -->
        <h2>1. Container Colors</h2>

        <div class="bg-primary text-white p-3 mb-3">
            Primary Color
        </div>

        <div class="bg-success text-white p-3 mb-3">
            Success Color
        </div>

        <div class="bg-warning p-3 mb-3">
            Warning Color
        </div>

        <div class="bg-danger text-white p-3 mb-3">
            Danger Color
        </div>

        <hr>

        <!-- Borders -->
        <h2>2. Container Borders</h2>

        <div class="border p-3 mb-3">
            Normal Border
        </div>

        <div class="border border-primary p-3 mb-3">
            Primary Border
        </div>

        <div class="border border-success p-3 mb-3">
            Success Border
        </div>

        <div class="border border-danger p-3 mb-3">
            Danger Border
        </div>

        <hr>

        <!-- Color + Border -->
        <h2>3. Color and Border Together</h2>

        <div class="bg-light border border-primary p-3 mb-3">
            Light background with Primary border
        </div>

        <div class="bg-warning border border-dark p-3 mb-3">
            Warning background with Dark border
        </div>

    </div>

</body>
</html>
