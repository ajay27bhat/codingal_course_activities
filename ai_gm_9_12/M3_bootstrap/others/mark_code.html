<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Mark and Code</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h1>Bootstrap Text Formatting</h1>

        <hr>

        <!-- Mark -->
        <h2>1. Mark</h2>

        <p>
            Bootstrap makes it easy to create
            <mark>responsive websites</mark>.
        </p>

        <p>
            Remember to <mark>save your work</mark> regularly.
        </p>

        <hr>

        <!-- Code -->
        <h2>2. Code</h2>

        <p>
            To display text as computer code, use
            <code>&lt;code&gt;</code>.
        </p>

        <p>
            Example:
            <code>print("Hello World")</code>
        </p>

        <p>
            You can also use:
            <code>console.log("Hello")</code>
        </p>

    </div>

</body>
</html>
