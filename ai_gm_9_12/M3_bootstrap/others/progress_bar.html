<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Progress Bar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h1>Bootstrap Progress Bar</h1>

        <hr>

        <!-- Basic Progress Bar -->
        <h3>Course Progress</h3>

        <div class="progress">
            <div class="progress-bar" style="width: 70%;">
                70%
            </div>
        </div>

        <br>

        <!-- Different Progress Bars -->
        <h3>Different Progress Bars</h3>

        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 90%;">
                90%
            </div>
        </div>

        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width: 50%;">
                50%
            </div>
        </div>

        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width: 30%;">
                30%
            </div>
        </div>

        <hr>

        <!-- Multiple Progress Bars -->
        <h3>Multiple Progress Bars</h3>

        <div class="progress">
            <div class="progress-bar bg-success" style="width: 40%;">
                HTML
            </div>

            <div class="progress-bar bg-warning" style="width: 30%;">
                CSS
            </div>

            <div class="progress-bar bg-danger" style="width: 20%;">
                JavaScript
            </div>
        </div>

    </div>

</body>
</html>
