<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Badges</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h1>Bootstrap Badges</h1>

        <hr>

        <!-- Basic Badges -->
        <h2>
            Notifications
            <span class="badge bg-primary">5</span>
        </h2>

        <h3>
            Messages
            <span class="badge bg-success">10</span>
        </h3>

        <h4>
            New
            <span class="badge bg-danger">New</span>
        </h4>

        <hr>

        <!-- Different Badge Colors -->
        <h2>Badge Colors</h2>

        <span class="badge bg-primary">Primary</span>
        <span class="badge bg-secondary">Secondary</span>
        <span class="badge bg-success">Success</span>
        <span class="badge bg-danger">Danger</span>
        <span class="badge bg-warning text-dark">Warning</span>
        <span class="badge bg-info text-dark">Info</span>
        <span class="badge bg-dark">Dark</span>

        <hr>

        <!-- Pill Badges -->
        <h2>Pill Badges</h2>

        <span class="badge rounded-pill bg-primary">Python</span>
        <span class="badge rounded-pill bg-success">HTML</span>
        <span class="badge rounded-pill bg-danger">CSS</span>
        <span class="badge rounded-pill bg-warning text-dark">JavaScript</span>

    </div>

</body>
</html>
