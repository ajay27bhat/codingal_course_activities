<!DOCTYPE html>
<html>
<head>
    <title>Precise Positioning</title>

    <style>
        .container {
            width: 400px;
            height: 250px;
            border: 2px solid black;
            position: relative;
        }

        .box {
            width: 100px;
            height: 60px;
            background-color: lightblue;
            position: absolute;
            top: 50px;
            left: 100px;
        }
    </style>
</head>

<body>

    <h2>Precise Positioning</h2>

    <div class="container">
        <div class="box">Box</div>
    </div>

</body>
</html>
