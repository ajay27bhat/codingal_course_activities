<!DOCTYPE html>
<html>
<head>
    <title>Active and Disabled</title>

    <style>
        /* Active state */
        button:active {
            background-color: green;
            color: white;
        }

        /* Disabled state */
        button:disabled {
            background-color: gray;
            color: white;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <h2>Active and Disabled Buttons</h2>

    <button>Click Me</button>

    <button disabled>Disabled Button</button>

</body>
</html>
