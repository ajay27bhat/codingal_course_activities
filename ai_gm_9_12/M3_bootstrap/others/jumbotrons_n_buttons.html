<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Jumbotron and Buttons</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <!-- Jumbotron -->
        <div class="bg-light p-5 rounded mb-4">
            <h1 class="display-4">Welcome to Bootstrap!</h1>

            <p class="lead">
                Bootstrap helps us create beautiful and responsive websites easily.
            </p>

            <hr>

            <p>
                Learn HTML, CSS, JavaScript and Bootstrap.
            </p>

            <button class="btn btn-primary">
                Learn More
            </button>
        </div>

        <!-- Buttons -->
        <h2>Bootstrap Buttons</h2>

        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>
        <button class="btn btn-info">Info</button>
        <button class="btn btn-dark">Dark</button>
        <button class="btn btn-light">Light</button>

        <hr>

        <!-- Outline Buttons -->
        <h2>Outline Buttons</h2>

        <button class="btn btn-outline-primary">Primary</button>
        <button class="btn btn-outline-success">Success</button>
        <button class="btn btn-outline-danger">Danger</button>

    </div>

</body>
</html>
