<!DOCTYPE html>
<html>
<head>
    <title>Focus Example</title>

    <style>
        /* Focus state */
        input:focus {
            background-color: lightyellow;
            border: 2px solid blue;
            outline: none;
        }
    </style>
</head>

<body>

    <h2>Focus Example</h2>

    <label>Enter your name:</label>
    <input type="text" placeholder="Click here">

</body>
</html>
