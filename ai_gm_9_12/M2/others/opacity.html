<!DOCTYPE html>
<html>
<head>
    <title>CSS Opacity</title>

    <style>
        .box1 {
            background-color: blue;
            opacity: 1;
        }

        .box2 {
            background-color: blue;
            opacity: 0.5;
        }

        .box3 {
            background-color: blue;
            opacity: 0.2;
        }
    </style>
</head>

<body>

    <h2>CSS Opacity</h2>

    <div class="box1">Opacity: 1</div>
    <br>

    <div class="box2">Opacity: 0.5</div>
    <br>

    <div class="box3">Opacity: 0.2</div>

</body>
</html>
