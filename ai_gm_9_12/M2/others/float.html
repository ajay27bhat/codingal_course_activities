<!DOCTYPE html>
<html>
<head>
    <title>CSS Float</title>

    <style>
        .box {
            width: 150px;
            height: 100px;
            background-color: lightblue;
            float: left;
            margin-right: 15px;
        }
    </style>
</head>

<body>

    <h2>CSS Float Example</h2>

    <div class="box">Box</div>

    <p>
        This text moves around the floated box.
        The float property allows an element to move
        to the left or right, while other content
        flows around it.
    </p>

</body>
</html>
